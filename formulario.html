<div class="app-container">
  <!-- #region 1. ENCABEZADO Y MARCA -->
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-icon">
        <span class="material-symbols-outlined">sync</span>
      </div>
      <div>
        <h1>Nueva Actividad</h1>
        <p>Gestión Comercial & Sincronización</p>
      </div>
    </div>
  </header>
  <!-- #endregion -->

  <!-- #region 2. BLOQUE PRINCIPAL DE FORMULARIO -->
  <div id="formActividad" class="activity-form">
    <div class="form-cards-grid">
      <!-- #region 2.1 TARJETA INFORMACIÓN DEL CLIENTE -->
      <div class="form-card">
        <div class="card-section-header">
          <span class="material-symbols-outlined section-icon">business</span>
          <h3>Información del Cliente</h3>
        </div>

        <div class="card-body">
          <!-- Campo: Título / Asunto -->
          <div class="form-group">
            <label for="titulo">Asunto / Título *</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon"
                >assignment</span
              >
              <input
                type="text"
                id="titulo"
                placeholder="Ej. Sistema ERP"
                autocomplete="off"
              />
            </div>
          </div>

          <!-- Campo: Empresa -->
          <div class="form-group">
            <label for="empresa">Nombre de la Empresa *</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">domain</span>
              <input
                type="text"
                id="empresa"
                placeholder="Ej. Empresa ABC"
                autocomplete="off"
              />
            </div>
          </div>

          <!-- Campo: Monto -->
          <div class="form-group">
            <label for="monto">Monto estimado ($ MXN) *</label>
            <div class="input-wrapper">
              <span class="material-symbols-outlined input-icon">payments</span>
              <input
                type="number"
                id="monto"
                placeholder="Ej. 120000"
                min="0"
                step="0.01"
              />
            </div>
          </div>
        </div>
      </div>
      <!-- #endregion -->

      <!-- #region 2.2 TARJETA CLASIFICACIÓN Y ESTADO -->
      <div class="form-card">
        <div class="card-section-header">
          <span class="material-symbols-outlined section-icon">tune</span>
          <h3>Clasificación & Estado</h3>
        </div>

        <div class="card-body">
          <!-- Campo: Estado -->
          <div class="form-group">
            <label for="estado">Estado inicial *</label>
            <div class="select-wrapper">
              <span class="material-symbols-outlined input-icon">flag</span>
              <select id="estado">
                <option value="Nuevo" selected>Nuevo</option>
                <option value="Contactado">Contactado</option>
                <option value="Propuesta">Propuesta</option>
                <option value="Cerrado">Cerrado</option>
              </select>
              <span class="material-symbols-outlined select-arrow"
                >expand_more</span
              >
            </div>
          </div>

          <!-- Campo: Prioridad (Botones Radio Interactivos) -->
          <div class="form-group">
            <label>Nivel de Prioridad *</label>
            <div class="priority-selector">
              <label class="priority-option priority-baja">
                <input type="radio" name="prioridad" value="Baja" />
                <span class="priority-btn">
                  <span class="dot"></span> Baja
                </span>
              </label>

              <label class="priority-option priority-media">
                <input type="radio" name="prioridad" value="Media" checked />
                <span class="priority-btn">
                  <span class="dot"></span> Media
                </span>
              </label>

              <label class="priority-option priority-alta">
                <input type="radio" name="prioridad" value="Alta" />
                <span class="priority-btn">
                  <span class="dot"></span> Alta
                </span>
              </label>
            </div>
          </div>
        </div>
      </div>
      <!-- #endregion -->
    </div>

    <!-- #region 2.3 BOTÓN DE SINCRONIZACIÓN -->
    <button type="button" id="btnGuardar" class="btn-submit">
      <span>Guardar y Sincronizar</span>
      <span class="material-symbols-outlined btn-arrow">send</span>
    </button>
    <!-- #endregion -->
  </div>
  <!-- #endregion -->

  <!-- #region 3. CONTENEDOR DE TOASTS -->
  <div id="toastContainer" class="toast-container"></div>
  <!-- #endregion -->
</div>
